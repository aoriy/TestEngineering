[project]
name = "testengineering"
version = "0.1.0"
description = "Python test-automation project"
requires-python = ">=3.12"
dependencies = [
    "pytest",
    "pytest-html",
    "allure-pytest",
    "requests",
    "python-dotenv",
    "loguru",
    "openpyxl",
    "PyYAML>=5.1",
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.2",
    "sqlalchemy>=2.0.52",
    "pydantic-settings>=2.15.0",
    "jinja2>=3.1.6",
    "jsonpath-ng>=1.8.0",
    "locust>=2.46.3",
    "playwright>=1.62.0",
]

[project.optional-dependencies]
dev = [
    "black",
    "flake8",
    "mypy",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"

[[tool.mypy.overrides]]
module = "requests"
ignore_missing_imports = true
